<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img"><title>Jev and LLM harness runtime path</title><desc>Runtime path.</desc><style>
text{font-family:'DejaVu Sans',sans-serif}
.th{font-size:14px;font-weight:bold;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#993C1D}
.c-coral .th{fill:#712B13}
.c-coral .ts{fill:#993C1D}
.c-purple rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}
</style><rect width="880" height="660" fill="#FFFFFF"/>
<rect fill="none" stroke="#888780" x="40" y="112" width="600" height="80" rx="10" stroke-width="0.8" stroke-dasharray="3 3"/>
<rect fill="none" stroke="#888780" x="40" y="312" width="600" height="212" rx="10" stroke-width="0.8" stroke-dasharray="3 3"/>
<text class="ts" fill="#5F5E5A" font-size="12" x="52" y="126" dominant-baseline="central">Execution layer</text>
<text class="ts" fill="#0F6E56" font-size="12" x="52" y="248" dominant-baseline="central">Routing layer</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="52" y="510" dominant-baseline="central">Execution layer</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="240" y="40" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#2C2C2A" x="340" y="62" text-anchor="middle" dominant-baseline="central">Task state</text></g>
<line x1="340" y1="84" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="220" y="124" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#2C2C2A" x="340" y="142" text-anchor="middle" dominant-baseline="central">Action-space compiler</text><text class="ts" font-size="12" fill="#5F5E5A" x="340" y="162" text-anchor="middle" dominant-baseline="central">Typed options, state slice</text></g>
<line x1="340" y1="180" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="220" y="220" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#085041" x="340" y="238" text-anchor="middle" dominant-baseline="central">Jev router</text><text class="ts" font-size="12" fill="#0F6E56" x="340" y="258" text-anchor="middle" dominant-baseline="central">Closed, narrow, or escalate</text></g>
<path d="M340 276 L340 304 L145 304 L145 334" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="276" x2="340" y2="334" class="arr" marker-end="url(#arrow)"/>
<path d="M340 304 L535 304 L535 334" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="60" y="336" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#085041" x="145" y="354" text-anchor="middle" dominant-baseline="central">Jev decides</text><text class="ts" font-size="12" fill="#0F6E56" x="145" y="374" text-anchor="middle" dominant-baseline="central">If conf ≥ τ(s)</text></g>
<g class="c-coral"><rect fill="#FFFFFF" stroke="#993C1D" x="255" y="336" width="170" height="56" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/><text class="th" font-size="14" font-weight="bold" fill="#712B13" x="340" y="354" text-anchor="middle" dominant-baseline="central">LLM narrows</text><text class="ts" font-size="12" fill="#993C1D" x="340" y="374" text-anchor="middle" dominant-baseline="central">Optional menu, off by default</text></g>
<g class="c-coral"><rect fill="#FAECE7" stroke="#993C1D" x="450" y="336" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#712B13" x="535" y="354" text-anchor="middle" dominant-baseline="central">LLM executes</text><text class="ts" font-size="12" fill="#993C1D" x="535" y="374" text-anchor="middle" dominant-baseline="central">ReAct + tool calls</text></g>
<path d="M145 392 L145 420 L340 420" fill="none" class="arr"/>
<path d="M535 392 L535 420 L340 420" fill="none" class="arr"/>
<line x1="340" y1="392" x2="340" y2="450" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="220" y="452" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#2C2C2A" x="340" y="470" text-anchor="middle" dominant-baseline="central">Guard + execute</text><text class="ts" font-size="12" fill="#5F5E5A" x="340" y="490" text-anchor="middle" dominant-baseline="central">Schema, irreversible gate</text></g>
<line x1="340" y1="508" x2="340" y2="546" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="220" y="548" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#2C2C2A" x="340" y="566" text-anchor="middle" dominant-baseline="central">Trace store</text><text class="ts" font-size="12" fill="#5F5E5A" x="340" y="586" text-anchor="middle" dominant-baseline="central">Route, outcome, cost</text></g>
<g class="c-purple"><rect fill="#EEEDFE" stroke="#534AB7" x="540" y="548" width="220" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" fill="#3C3489" font-size="14" font-weight="bold" x="650" y="566" text-anchor="middle" dominant-baseline="central">Evolution loops</text><text class="ts" fill="#534AB7" font-size="12" x="650" y="586" text-anchor="middle" dominant-baseline="central">Execution layer + routing layer</text></g>
<line x1="460" y1="576" x2="538" y2="576" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M700 548 L700 152" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-dasharray="5 4"/>
<path d="M700 152 L642 152" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M700 248 L462 248" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M700 420 L642 420" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="500" dominant-baseline="central">New harness version</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="136" dominant-baseline="central">to the compiler:</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="152" dominant-baseline="central">a generated version</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="404" dominant-baseline="central">to the execution layer:</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="420" dominant-baseline="central">prompts, tool docs</text>
<text class="ts" fill="#5F5E5A" font-size="12" x="710" y="270" dominant-baseline="central">to the router: τ per cluster</text>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="200" y="626" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" font-size="12" fill="#5F5E5A" x="222" y="633" dominant-baseline="central">Jev call</text>
<g class="c-coral"><rect fill="#FAECE7" stroke="#993C1D" x="330" y="626" width="14" height="14" rx="3" stroke-width="0.5"/></g><text class="ts" font-size="12" fill="#5F5E5A" x="352" y="633" dominant-baseline="central">LLM call</text>
</svg>

  <text fill="#374151" font-size="13" text-anchor="middle" x="640.0" y="40.0">The same step on the three paths. The router picks one per step; the guard runs on every path and forces escalation for irreversible actions regardless of confidence.</text>
  <text fill="#15803D" font-size="12" text-anchor="middle" x="640.0" y="460.0">What moves between paths over time: macro-action mining turns frequent LLM sequences into new Jev options, so open territory becomes closed territory.</text>

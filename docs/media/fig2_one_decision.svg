  <text fill="#888888" font-size="10" text-anchor="middle" x="340.0" y="187.1">parse, track data, list legal actions</text>
  <rect fill="#FEF3C7" height="64.0" rx="8" stroke="#F59E0B" stroke-width="2" width="215.0" x="482.5" y="143.0"/>
  <text fill="#333333" font-size="13" font-weight="bold" text-anchor="middle" x="590.0" y="172.1">2 · judge  (Jev)</text>
  <text fill="#888888" font-size="10" text-anchor="middle" x="590.0" y="187.1">one request, every question at once</text>
  <rect fill="#DBEAFE" height="64.0" rx="8" stroke="#3B82F6" stroke-width="2" width="215.0" x="732.5" y="143.0"/>

  <text fill="#6B7280" font-size="11" text-anchor="start" x="150.0" y="166.0">≈ 1 Jev call · the LLM only fills a free-text argument · lowest cost and latency</text>
  <text fill="#6B7280" font-size="11" text-anchor="start" x="150.0" y="291.0">1 short LLM call to enumerate + 1 Jev call to choose · the LLM does not act</text>

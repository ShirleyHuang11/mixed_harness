  <text fill="#374151" font-size="13" text-anchor="middle" x="590.0" y="40.0">Example, retail seed. Customer: “I'm Yusuf Rossi, zip 19122, I want to exchange the keyboard in order #W2378156.”</text>
  <text fill="#1D4ED8" font-size="11" text-anchor="middle" x="340.0" y="412.0">name · zip · order id found;</text>
  <text fill="#1D4ED8" font-size="11" text-anchor="middle" x="340.0" y="428.0">legal now: look up by name+zip; ask identity</text>
  <text fill="#B45309" font-size="11" text-anchor="middle" x="590.0" y="412.0">action = look up by name+zip (0.72);</text>
  <text fill="#B45309" font-size="11" text-anchor="middle" x="590.0" y="428.0">user confirmed? 0.05</text>
  <text fill="#1D4ED8" font-size="11" text-anchor="middle" x="840.0" y="412.0">find_user_id_by_name_zip(Yusuf, Rossi, 19122);</text>

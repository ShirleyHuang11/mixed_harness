  <text fill="#374151" font-size="14" text-anchor="middle" x="620.0" y="40.0">The same turn on each route. Customer: “I’m Yusuf Rossi, zip 19122, I want to exchange the keyboard in order #W2378156.”</text>
  <text fill="#374151" font-size="12" text-anchor="middle" x="620.0" y="480.0">Where they part: three turns later the customer asks for the specifications of the replacement items.</text>
  <text fill="#6B7280" font-size="11" text-anchor="middle" x="620.0" y="500.0">Jev route: no template answers, the call is transferred.   LLM route: the model writes the answer.   Mixed route: Jev picks “reply with the LLM” and the model writes it; every other turn stays on code + Jev.</text>

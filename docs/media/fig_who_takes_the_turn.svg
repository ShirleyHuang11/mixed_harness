<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Who takes the turn: a turn arrives; if a learned rule settles it, code takes it for free; if the listed actions cover it and Jev is confident, Jev takes it in 0.4 seconds; otherwise the LLM takes it. Shares on retail: code about 10 percent, Jev about 40, the LLM about 50. After every batch of conversations the table is refit from the records.">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#23231f">Who takes the turn?</text>
  <text x="480" y="58" text-anchor="middle" font-size="13.5" fill="#6b6a63">A turn arrives (a customer message or a tool result). Code lists what the state allows, then one of three takes it.</text>
  <rect x="400" y="76" width="160" height="44" rx="14" fill="#f1efe8" stroke="#dcdad2" stroke-width="1.5"/>
  <text x="480" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#23231f">a turn</text>
  <text x="480" y="112" text-anchor="middle" font-size="12" fill="#6b6a63">+ the listed actions</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6b6a63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <path d="M430 120 C380 150 330 150 290 174" fill="none" stroke="#6b6a63" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="330" y="144" text-anchor="end" font-size="12" fill="#6b6a63">a learned rule settles it</text>
  <line x1="480" y1="120" x2="480" y2="174" stroke="#6b6a63" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="490" y="156" font-size="12" fill="#6b6a63">listed, and Jev is sure</text>
  <path d="M530 120 C580 150 630 150 670 174" fill="none" stroke="#6b6a63" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="632" y="144" font-size="12" fill="#6b6a63">open, or Jev is not sure</text>
  
  <rect x="190" y="178" width="180" height="224" rx="18" fill="#ececfb" stroke="#4a4a9c" stroke-width="2"/>
  <rect x="254.0" y="210" width="52" height="48" rx="10" fill="#ffffff" stroke="#4a4a9c" stroke-width="2"/>
  <line x1="280.0" y1="210" x2="280.0" y2="198" stroke="#4a4a9c" stroke-width="2"/><circle cx="280.0" cy="195" r="4" fill="#4a4a9c"/>
  <rect x="264.0" y="224" width="10" height="10" rx="2" fill="#4a4a9c"/><rect x="286.0" y="224" width="10" height="10" rx="2" fill="#4a4a9c"/>
  <rect x="268.0" y="242" width="24" height="5" rx="2" fill="#4a4a9c"/>
  <text x="280.0" y="296" text-anchor="middle" font-size="20" font-weight="bold" fill="#23231f">Code</text>
  <text x="280.0" y="322" text-anchor="middle" font-size="13" fill="#6b6a63">a rule from the records</text>
  <text x="280.0" y="340" text-anchor="middle" font-size="13" fill="#6b6a63">no model call</text>
  <rect x="204" y="362" width="152" height="26" rx="13" fill="#ffffff" stroke="#4a4a9c" stroke-width="1.2"/>
  <text x="280.0" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a4a9c">~10% of turns · free</text>
  
  <rect x="390" y="178" width="180" height="224" rx="18" fill="#e1f5ee" stroke="#0f6e56" stroke-width="2"/>
  <circle cx="480.0" cy="236" r="27" fill="#ffffff" stroke="#0f6e56" stroke-width="2"/>
  <circle cx="470.0" cy="230" r="3.5" fill="#0f6e56"/><circle cx="490.0" cy="230" r="3.5" fill="#0f6e56"/>
  <path d="M469.0 244 Q480.0 254 491.0 244" fill="none" stroke="#0f6e56" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="514.0" cy="214" r="11" fill="#ffffff" stroke="#0f6e56" stroke-width="2"/><line x1="514.0" y1="214" x2="514.0" y2="207" stroke="#0f6e56" stroke-width="2"/><line x1="514.0" y1="214" x2="519.0" y2="216" stroke="#0f6e56" stroke-width="2"/>
  <text x="480.0" y="296" text-anchor="middle" font-size="20" font-weight="bold" fill="#23231f">Jev</text>
  <text x="480.0" y="322" text-anchor="middle" font-size="13" fill="#6b6a63">picks a listed action</text>
  <text x="480.0" y="340" text-anchor="middle" font-size="13" fill="#6b6a63">kept if p ≥ τ</text>
  <rect x="404" y="362" width="152" height="26" rx="13" fill="#ffffff" stroke="#0f6e56" stroke-width="1.2"/>
  <text x="480.0" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f6e56">~40% · 0.4 s · ~free</text>
  
  <rect x="590" y="178" width="180" height="224" rx="18" fill="#faece7" stroke="#993c1d" stroke-width="2"/>
  <path d="M650.0 246 a16 16 0 0 1 4 -30 a20 20 0 0 1 38 -8 a16 16 0 0 1 22 22 a14 14 0 0 1 -6 26 Z" fill="#ffffff" stroke="#993c1d" stroke-width="2"/>
  <circle cx="670.0" cy="234" r="3.5" fill="#993c1d"/><circle cx="690.0" cy="234" r="3.5" fill="#993c1d"/>
  <path d="M671.0 246 Q680.0 253 689.0 246" fill="none" stroke="#993c1d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="680.0" y="296" text-anchor="middle" font-size="20" font-weight="bold" fill="#23231f">LLM</text>
  <text x="680.0" y="322" text-anchor="middle" font-size="13" fill="#6b6a63">writes the turn itself</text>
  <text x="680.0" y="340" text-anchor="middle" font-size="13" fill="#6b6a63">tools, plans, free text</text>
  <rect x="604" y="362" width="152" height="26" rx="13" fill="#ffffff" stroke="#993c1d" stroke-width="1.2"/>
  <text x="680.0" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#993c1d">~50% · 2–10 s · the bill</text>
  <rect x="150" y="420" width="660" height="46" rx="12" fill="#f6f5ff" stroke="#534ab7" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="480" y="440" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#534ab7">Every turn is recorded. After each batch of conversations the table is refit:</text>
  <text x="480" y="458" text-anchor="middle" font-size="12.5" fill="#534ab7">turns where Jev matched the LLM move to Jev; turns the LLM always handled the same way move to code.</text>
</svg>

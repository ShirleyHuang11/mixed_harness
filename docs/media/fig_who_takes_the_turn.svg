<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Three workers at a round table with one retail turn on it: the customer asks to cancel order W2378156. Code lists what is allowed now: cancel the pending order, get product details, or ask which order. Jev picks cancel pending order W2378156 with probability 0.97, above the threshold 0.9, so it runs. The LLM writes a reply when nothing listed fits.">

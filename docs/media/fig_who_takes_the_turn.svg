<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Three workers at a round table handle every turn. Code, a robot with a checklist, lists the actions the state allows, fills their arguments and checks the chosen action before it runs. Jev, a judge with a stopwatch, picks a listed action when the turn is closed and it is sure, about 40 percent of turns in 0.4 seconds. The LLM, a cloud with sparkles and a pen, takes the turns no listed action covers or where Jev is not sure, about 60 percent. On the table: the current turn and the thresholds table, refit after every batch of conversations.">
  <rect width="960" height="620" fill="#ffffff"/><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#6b6a63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b2430" flood-opacity="0.12"/></filter>
  <filter id="soft" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1b2430" flood-opacity="0.10"/></filter>
  <radialGradient id="tabletop" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#fbf8f0"/><stop offset="100%" stop-color="#e7e2d4"/></radialGradient>
  <linearGradient id="tablerim" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cfc7b4"/><stop offset="100%" stop-color="#b8ae99"/></linearGradient>
  <linearGradient id="gcode" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e6e6fb"/></linearGradient>
  <linearGradient id="gjev" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dcf3ea"/></linearGradient>
  <linearGradient id="gllm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fbe6da"/></linearGradient>
  <linearGradient id="bcode" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6b6bd6"/><stop offset="100%" stop-color="#4a4a9c"/></linearGradient>
  <linearGradient id="bjev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2fa37f"/><stop offset="100%" stop-color="#0f6e56"/></linearGradient>
  <linearGradient id="bllm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0894a"/><stop offset="100%" stop-color="#b4521c"/></linearGradient>
</defs>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#23231f">Three workers at one table</text>
  <text x="480" y="56" text-anchor="middle" font-size="13.5" fill="#6b6a63">Every turn lands on the table. Code prepares it and checks the result; Jev or the LLM decides it.</text>
  <g transform="rotate(-30 330 300)"><rect x="314" y="290" width="32" height="20" rx="6" fill="#d9d2c0" stroke="#c3bba6" stroke-width="1.2"/><rect x="314" y="284" width="32" height="8" rx="4" fill="#c3bba6"/></g><g transform="rotate(30 700 300)"><rect x="684" y="290" width="32" height="20" rx="6" fill="#d9d2c0" stroke="#c3bba6" stroke-width="1.2"/><rect x="684" y="284" width="32" height="8" rx="4" fill="#c3bba6"/></g><g transform="rotate(150 600 410)"><rect x="584" y="400" width="32" height="20" rx="6" fill="#d9d2c0" stroke="#c3bba6" stroke-width="1.2"/><rect x="584" y="394" width="32" height="8" rx="4" fill="#c3bba6"/></g>
  <ellipse cx="480" cy="352" rx="172" ry="72" fill="url(#tablerim)"/>
  <ellipse cx="480" cy="340" rx="170" ry="66" fill="url(#tabletop)" stroke="#d6d0c0" stroke-width="1.5" filter="url(#soft)"/>
  <g transform="rotate(-6 440 334)" filter="url(#soft)"><rect x="402" y="308" width="76" height="52" rx="6" fill="#ffffff" stroke="#6b6a63" stroke-width="1.2"/>
    <text x="440" y="329" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#23231f">the turn</text>
    <text x="440" y="344" text-anchor="middle" font-size="10" fill="#6b6a63">message or</text><text x="440" y="356" text-anchor="middle" font-size="10" fill="#6b6a63">tool result</text></g>
  <g transform="rotate(5 530 338)" filter="url(#soft)"><rect x="492" y="312" width="76" height="52" rx="6" fill="#f6f5ff" stroke="#534ab7" stroke-width="1.2"/>
    <text x="530" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#534ab7">the table</text>
    <text x="530" y="344" text-anchor="middle" font-size="10" fill="#534ab7">τ per state type</text><text x="530" y="356" text-anchor="middle" font-size="10" fill="#534ab7">refit each batch</text></g>
  <g filter="url(#soft)">
  <rect x="116" y="286" width="68" height="46" rx="16" fill="url(#bcode)"/>
  <rect x="132" y="296" width="36" height="26" rx="5" fill="#ffffff" opacity="0.95"/>
  <path d="M139 304 h22 M139 311 h22 M139 318 h14" stroke="#4a4a9c" stroke-width="2" stroke-linecap="round"/>
  <path d="M141 303 l3 3 l5 -6" fill="none" stroke="#0f6e56" stroke-width="2" stroke-linecap="round"/>
  <rect x="120" y="232" width="60" height="52" rx="14" fill="url(#bcode)"/>
  <rect x="128" y="240" width="44" height="36" rx="9" fill="#141a2e"/>
  <rect x="134" y="250" width="10" height="12" rx="3" fill="#8ef0ff"/><rect x="156" y="250" width="10" height="12" rx="3" fill="#8ef0ff"/>
  <path d="M140 268 Q150 274 160 268" fill="none" stroke="#8ef0ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="150" y1="232" x2="150" y2="218" stroke="#4a4a9c" stroke-width="3"/><circle cx="150" cy="214" r="5" fill="#f5c542"/>
  <rect x="112" y="246" width="8" height="22" rx="4" fill="#4a4a9c"/><rect x="180" y="246" width="8" height="22" rx="4" fill="#4a4a9c"/>
</g>
  <text x="150" y="358" text-anchor="middle" font-size="18" font-weight="bold" fill="#23231f">Code</text>
  <rect x="45.0" y="368" width="210" height="26" rx="13" fill="#ffffff" stroke="#4a4a9c" stroke-width="1.4" filter="url(#soft)"/><text x="150" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a4a9c">every turn · free</text>
  <g filter="url(#shadow)"><path d="M140 194 L150 212 L166 194 Z" fill="url(#gcode)" stroke="#4a4a9c" stroke-width="1.5" stroke-linejoin="round"/><rect x="40" y="80" width="236" height="114" rx="14" fill="url(#gcode)" stroke="#4a4a9c" stroke-width="1.5"/><rect x="41.5" y="81.5" width="233" height="111" rx="12.5" fill="url(#gcode)"/></g><text x="158.0" y="102" text-anchor="middle" font-size="12" fill="#23231f">Here is what this state allows:</text><text x="158.0" y="118" text-anchor="middle" font-size="12" fill="#23231f">these tools (arguments filled),</text><text x="158.0" y="134" text-anchor="middle" font-size="12" fill="#23231f">these records, these replies.</text><text x="158.0" y="150" text-anchor="middle" font-size="12" fill="#23231f">And I check every action</text><text x="158.0" y="166" text-anchor="middle" font-size="12" fill="#23231f">before it runs: no write</text><text x="158.0" y="182" text-anchor="middle" font-size="12" fill="#23231f">without the customer's yes.</text>
  <g filter="url(#soft)">
  <path d="M586 220 v-26 a34 34 0 0 1 68 0 v26 Z" fill="url(#bjev)"/>
  <path d="M611 180 l9 14 l9 -14 Z" fill="#ffffff"/>
  <circle cx="620" cy="150" r="32" fill="#ffffff" stroke="#0f6e56" stroke-width="2.5"/>
  <circle cx="609" cy="144" r="4" fill="#0f6e56"/><circle cx="631" cy="144" r="4" fill="#0f6e56"/>
  <circle cx="600" cy="156" r="5" fill="#ffd1c2" opacity="0.8"/><circle cx="640" cy="156" r="5" fill="#ffd1c2" opacity="0.8"/>
  <path d="M608 159 Q620 170 632 159" fill="none" stroke="#0f6e56" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="662" cy="124" r="14" fill="#ffffff" stroke="#0f6e56" stroke-width="2.5"/><rect x="659" y="104" width="6" height="6" rx="1" fill="#0f6e56"/>
  <line x1="662" y1="124" x2="662" y2="115" stroke="#0f6e56" stroke-width="2.2" stroke-linecap="round"/><line x1="662" y1="124" x2="668" y2="127" stroke="#0f6e56" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="558" y="168" width="30" height="40" rx="5" fill="#ffffff" stroke="#0f6e56" stroke-width="2" transform="rotate(-12 573 188)"/>
  <path d="M566 188 l5 5 l10 -11" fill="none" stroke="#0f6e56" stroke-width="2.5" stroke-linecap="round" transform="rotate(-12 573 188)"/>
</g>
  <text x="620" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#23231f">Jev</text>
  <rect x="515.0" y="256" width="210" height="26" rx="13" fill="#ffffff" stroke="#0f6e56" stroke-width="1.4" filter="url(#soft)"/><text x="620" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f6e56">~40% of turns · 0.4 s · ~free</text>
  <g filter="url(#shadow)"><path d="M702 140 L668 150 L702 162 Z" fill="url(#gjev)" stroke="#0f6e56" stroke-width="1.5" stroke-linejoin="round"/><rect x="700" y="96" width="230" height="82" rx="14" fill="url(#gjev)" stroke="#0f6e56" stroke-width="1.5"/><rect x="701.5" y="97.5" width="227" height="79" rx="12.5" fill="url(#gjev)"/></g><text x="815.0" y="118" text-anchor="middle" font-size="12" fill="#23231f">Closed turn? I pick one of the</text><text x="815.0" y="134" text-anchor="middle" font-size="12" fill="#23231f">listed actions and say how sure</text><text x="815.0" y="150" text-anchor="middle" font-size="12" fill="#23231f">I am. If that clears τ for this</text><text x="815.0" y="166" text-anchor="middle" font-size="12" fill="#23231f">state type, my pick runs.</text>
  <g filter="url(#soft)">
  <path d="M746 500 v-22 a34 34 0 0 1 68 0 v22 Z" fill="url(#bllm)"/>
  <path d="M744 444 a18 18 0 0 1 6 -34 a24 24 0 0 1 44 -10 a18 18 0 0 1 26 26 a16 16 0 0 1 -8 30 Z" fill="#ffffff" stroke="#b4521c" stroke-width="2.5"/>
  <path d="M772 404 q10 -8 20 2 M758 424 q8 -10 22 -4 M780 426 q12 -4 18 6" fill="none" stroke="#b4521c" stroke-width="1.6" opacity="0.5" stroke-linecap="round"/>
  <circle cx="768" cy="432" r="4" fill="#b4521c"/><circle cx="790" cy="432" r="4" fill="#b4521c"/>
  <path d="M771 442 Q780 449 789 442" fill="none" stroke="#b4521c" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M820 387 Q820 396 829 396 Q820 396 820 405 Q820 396 811 396 Q820 396 820 387 Z" fill="#f5c542"/><path d="M740 396 Q740 402 746 402 Q740 402 740 408 Q740 402 734 402 Q740 402 740 396 Z" fill="#f5c542"/><path d="M826 415 Q826 420 831 420 Q826 420 826 425 Q826 420 821 420 Q826 420 826 415 Z" fill="#f5c542"/>
  <path d="M810 460 l14 -14 l6 6 l-14 14 Z" fill="#ffffff" stroke="#b4521c" stroke-width="2"/><path d="M810 460 l-3 9 l9 -3 Z" fill="#b4521c"/>
</g>
  <text x="780" y="526" text-anchor="middle" font-size="18" font-weight="bold" fill="#23231f">LLM</text>
  <rect x="675.0" y="536" width="210" height="26" rx="13" fill="#ffffff" stroke="#b4521c" stroke-width="1.4" filter="url(#soft)"/><text x="780" y="553" text-anchor="middle" font-size="12" font-weight="bold" fill="#b4521c">~60% of turns · 2–10 s · the bill</text>
  <g filter="url(#shadow)"><path d="M678 458 L732 440 L678 476 Z" fill="url(#gllm)" stroke="#b4521c" stroke-width="1.5" stroke-linejoin="round"/><rect x="430" y="436" width="250" height="82" rx="14" fill="url(#gllm)" stroke="#b4521c" stroke-width="1.5"/><rect x="431.5" y="437.5" width="247" height="79" rx="12.5" fill="url(#gllm)"/></g><text x="555.0" y="458" text-anchor="middle" font-size="12" fill="#23231f">Nothing listed fits, or Jev is</text><text x="555.0" y="474" text-anchor="middle" font-size="12" fill="#23231f">not sure? I take it: I read the</text><text x="555.0" y="490" text-anchor="middle" font-size="12" fill="#23231f">whole conversation, call the</text><text x="555.0" y="506" text-anchor="middle" font-size="12" fill="#23231f">tools, write the reply.</text>
  <path d="M196 270 C250 280 290 294 326 310" fill="none" stroke="#6b6a63" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="250" y="266" font-size="11" fill="#6b6a63">prepares</text>
  <path d="M596 284 C606 282 612 282 618 286" fill="none" stroke="#6b6a63" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="590" y="304" text-anchor="end" font-size="11" fill="#6b6a63">closed, sure</text>
  <path d="M612 396 C660 410 700 420 742 426" fill="none" stroke="#6b6a63" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="690" y="398" text-anchor="end" font-size="11" fill="#6b6a63">open, or not sure</text>
  <path d="M332 366 C290 384 240 390 206 394" fill="none" stroke="#6b6a63" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="56" y="418" font-size="11" fill="#6b6a63">the chosen action comes back to code</text>
  <text x="56" y="432" font-size="11" fill="#6b6a63">for the check, then runs; every turn</text>
  <text x="56" y="446" font-size="11" fill="#6b6a63">is recorded</text>
  <rect x="40" y="576" width="880" height="36" rx="10" fill="#f6f5ff" stroke="#534ab7" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="480" y="599" text-anchor="middle" font-size="12.5" fill="#534ab7">After each batch of conversations the table is refit: a state type where Jev's picks matched the LLM gets a τ it can clear; otherwise it is marked never.</text>
</svg>

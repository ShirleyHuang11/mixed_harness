  <linearGradient id="gllm" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fbe6da"/></linearGradient>
  <linearGradient id="bcode" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6b6bd6"/><stop offset="100%" stop-color="#4a4a9c"/></linearGradient>
  <linearGradient id="bjev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2fa37f"/><stop offset="100%" stop-color="#0f6e56"/></linearGradient>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img"><title>The tau2-bench test</title><desc>Four arms on the same benchmark: three rows of the results table and the held-out table.</desc><style>
text{font-family:'DejaVu Sans',sans-serif}
.th{font-size:14px;font-weight:bold;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
</style><rect width="880" height="420" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect fill="#F1EFE8" stroke="#888780" x="180" y="30" width="520" height="56" rx="8" stroke-width="0.5"/><text class="th" x="440" y="48" text-anchor="middle" dominant-baseline="central">τ²-bench retail, shared by every arm</text><text class="ts" x="440" y="68" text-anchor="middle" dominant-baseline="central">114 tasks · 16 tools · reward from database state · same user simulator, tasks and seeds</text></g>
<path d="M440 86 L440 116" class="arr"/>
<path d="M120 116 L760 116" class="arr"/>
<path d="M120 116 L120 148" class="arr" marker-end="url(#arrow)"/><path d="M333 116 L333 148" class="arr" marker-end="url(#arrow)"/><path d="M546 116 L546 148" class="arr" marker-end="url(#arrow)"/><path d="M760 116 L760 148" class="arr" marker-end="url(#arrow)"/>
<g><rect fill="#FAECE7" stroke="#A32D2D" x="25" y="150" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" fill="#712B2B" x="120" y="170" text-anchor="middle" dominant-baseline="central">LLM only</text><text class="ts" fill="#A32D2D" x="120" y="190" text-anchor="middle" dominant-baseline="central">every step escalates</text><text class="ts" fill="#A32D2D" x="120" y="206" text-anchor="middle" dominant-baseline="central">1 LLM call per turn</text></g>
<g><rect fill="#E1F5EE" stroke="#0F6E56" x="238" y="150" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" fill="#085041" x="333" y="170" text-anchor="middle" dominant-baseline="central">Jev only</text><text class="ts" fill="#0F6E56" x="333" y="190" text-anchor="middle" dominant-baseline="central">every step on the closed path</text><text class="ts" fill="#0F6E56" x="333" y="206" text-anchor="middle" dominant-baseline="central">1 Jev call per turn, 0 LLM</text></g>
<g><rect fill="#F1EFE8" stroke="#888780" x="451" y="150" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" x="546" y="170" text-anchor="middle" dominant-baseline="central">Mixed Harness</text><text class="ts" x="546" y="190" text-anchor="middle" dominant-baseline="central">Jev routes and picks</text><text class="ts" x="546" y="206" text-anchor="middle" dominant-baseline="central">the LLM takes the rest</text></g>
<g><rect fill="#EEEDFE" stroke="#534AB7" x="664" y="150" width="190" height="72" rx="8" stroke-width="0.5"/><text class="th" fill="#3C3489" x="759" y="170" text-anchor="middle" dominant-baseline="central">Mixed Harness, refit</text><text class="ts" fill="#534AB7" x="759" y="190" text-anchor="middle" dominant-baseline="central">thresholds refit per batch</text><text class="ts" fill="#534AB7" x="759" y="206" text-anchor="middle" dominant-baseline="central">scored on held-out tasks</text></g>
<path d="M120 222 L120 254" class="arr"/><path d="M333 222 L333 254" class="arr"/><path d="M546 222 L546 254" class="arr"/><path d="M759 222 L759 254" class="arr"/>
<path d="M120 254 L759 254" class="arr"/><path d="M440 254 L440 284" class="arr" marker-end="url(#arrow)"/>
<g><rect fill="#F1EFE8" stroke="#888780" x="140" y="286" width="600" height="72" rx="8" stroke-width="0.5"/><text class="th" x="440" y="306" text-anchor="middle" dominant-baseline="central">One table, generated from the artifacts</text><text class="ts" x="440" y="326" text-anchor="middle" dominant-baseline="central">tasks solved (pass^1) · cost relative to LLM only · turns taken by code / Jev / LLM</text><text class="ts" x="440" y="342" text-anchor="middle" dominant-baseline="central">the first three arms are the three rows of the results table; the fourth is the held-out table</text></g>
<text class="ts" x="440" y="392" text-anchor="middle" dominant-baseline="central">Holds if Mixed Harness lands within noise of LLM only on tasks solved at a fraction of its cost. Fails if it trails the best single arm.</text>
</svg>

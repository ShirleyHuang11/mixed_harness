<line x1="190" y1="292" x2="190" y2="320" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect fill="#EEEDFE" stroke="#534AB7" x="60" y="322" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#3C3489" x="190" y="340" text-anchor="middle" dominant-baseline="central">Open-model distillation</text><text class="ts" font-size="12" fill="#534AB7" x="190" y="360" text-anchor="middle" dominant-baseline="central">Optional weight arm</text></g>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="360" y="150" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#085041" x="490" y="168" text-anchor="middle" dominant-baseline="central">Router bandit</text><text class="ts" font-size="12" fill="#0F6E56" x="490" y="188" text-anchor="middle" dominant-baseline="central">Success minus λ·cost</text></g>
<line x1="490" y1="206" x2="490" y2="234" class="arr" marker-end="url(#arrow)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>Harness evolution loops</title><desc>Two loops over the trace store.</desc><style>
text{font-family:'DejaVu Sans',sans-serif}
.th{font-size:14px;font-weight:bold;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.box{fill:#F1EFE8;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.3;fill:none}
</style><rect width="680" height="440" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="240" y="40" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" fill="#2C2C2A" font-size="14" font-weight="bold" x="340" y="62" text-anchor="middle" dominant-baseline="central">Trace store</text></g>
<path d="M300 84 L300 118 L180 118 L180 148" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M380 84 L380 118 L500 118 L500 148" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<g class="c-purple"><rect fill="#EEEDFE" stroke="#534AB7" x="40" y="150" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" fill="#3C3489" font-size="14" font-weight="bold" x="180" y="168" text-anchor="middle" dominant-baseline="central">Mine the LLM's traces</text><text class="ts" fill="#534AB7" font-size="12" x="180" y="188" text-anchor="middle" dominant-baseline="central">Closed/open labels, repeated tool runs</text></g>
<line x1="180" y1="206" x2="180" y2="244" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<g class="c-purple"><rect fill="#EEEDFE" stroke="#534AB7" x="40" y="246" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" fill="#3C3489" font-size="14" font-weight="bold" x="180" y="264" text-anchor="middle" dominant-baseline="central">Generate the compiler</text><text class="ts" fill="#534AB7" font-size="12" x="180" y="284" text-anchor="middle" dominant-baseline="central">LLM writes it from schema + policy + seed; GEPA refines</text></g>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="360" y="150" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" fill="#085041" font-size="14" font-weight="bold" x="500" y="168" text-anchor="middle" dominant-baseline="central">Recalibrate τ per cluster</text><text class="ts" fill="#0F6E56" font-size="12" x="500" y="188" text-anchor="middle" dominant-baseline="central">From Jev-vs-LLM agreement in the step table</text></g>
<line x1="500" y1="206" x2="500" y2="244" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<g class="c-teal"><rect fill="#E1F5EE" stroke="#0F6E56" x="360" y="246" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" fill="#085041" font-size="14" font-weight="bold" x="500" y="264" text-anchor="middle" dominant-baseline="central">Bandit over the paths</text><text class="ts" fill="#0F6E56" font-size="12" x="500" y="284" text-anchor="middle" dominant-baseline="central">Success − λ·cost, ε shadow runs</text></g>
<path d="M180 302 L180 330 L300 330 L300 358" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<path d="M500 302 L500 330 L380 330 L380 358" class="arr" stroke="#5F5E5A" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="200" y="360" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" fill="#2C2C2A" font-size="14" font-weight="bold" x="340" y="382" text-anchor="middle" dominant-baseline="central">Deploy harness version</text></g>
<text class="ts" fill="#5F5E5A" font-size="12" x="340" y="420" text-anchor="middle" dominant-baseline="central">↻ the LLM explores, the next compiler takes over · recalibrate after every compiler change</text>
<g><rect fill="#EEEDFE" stroke="#534AB7" x="40" y="14" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" fill="#5F5E5A" font-size="12" x="62" y="21" dominant-baseline="central">Execution layer (slow)</text></g>
<g><rect fill="#E1F5EE" stroke="#0F6E56" x="516" y="14" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" fill="#5F5E5A" font-size="12" x="538" y="21" dominant-baseline="central">Routing layer (fast)</text></g>
</svg>

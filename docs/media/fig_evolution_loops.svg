.c-purple rect{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}
</style><rect width="680" height="540" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g><rect class="box" fill="#F1EFE8" stroke="#888780" x="240" y="40" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" font-size="14" font-weight="bold" fill="#2C2C2A" x="340" y="62" text-anchor="middle" dominant-baseline="central">Trace store</text></g>
